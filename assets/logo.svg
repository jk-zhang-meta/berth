<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Berth</title>
  <desc id="desc">A stylized B formed from a pier and two harbor berths.</desc>
  <defs>
    <linearGradient id="berth-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16345F"/>
      <stop offset=".5" stop-color="#0A203C"/>
      <stop offset="1" stop-color="#061429"/>
    </linearGradient>
    <radialGradient id="berth-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(146 92) rotate(49) scale(360 396)">
      <stop stop-color="#38E8D2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38E8D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="berth-brand" x1="148" y1="126" x2="398" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AF7CB"/>
      <stop offset=".5" stop-color="#32D5E5"/>
      <stop offset="1" stop-color="#4A82FF"/>
    </linearGradient>
    <filter id="berth-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#berth-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#berth-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#9EC6FF" stroke-opacity=".18" stroke-width="1.5"/>

  <g fill="none" stroke="url(#berth-brand)" stroke-linecap="round" stroke-linejoin="round" stroke-width="30" filter="url(#berth-shadow)">
    <path d="M158 132v248"/>
    <path d="M158 148h116c58 0 94 27 94 68s-36 68-94 68H158"/>
    <path d="M158 284h126c62 0 100 29 100 72s-38 72-100 72H158"/>
  </g>

  <g fill="#B9FFE8">
    <circle cx="158" cy="148" r="8"/>
    <circle cx="158" cy="284" r="8"/>
    <circle cx="158" cy="380" r="8"/>
  </g>
</svg>
